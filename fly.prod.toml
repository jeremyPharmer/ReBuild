# DEPRECATED — JeremyOS now deploys to Vercel. See DEPLOY.md.
# Target app: jeremyos-prod (legacy Fly — use Vercel instead)
# Interim: deploy to legacy rebuild-prod until jeremyos-prod exists:
#   fly deploy -c fly.prod.toml -a rebuild-prod
# See https://fly.io/docs/reference/configuration/

app = 'jeremyos-prod'
primary_region = 'sjc'

[build]

[env]
  NODE_ENV = 'production'
  JEREMYOS_ENV = 'prod'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'rebuild_prod_data'
  destination = '/app/.data'
