# Set Fly prod secrets from GitHub (when Fly dashboard "Failed to set secrets").
# Browser: add secrets under GitHub repo Settings → Secrets → Actions, then run this.
name: Set jeremyos-prod secrets

on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set secrets on Fly
        run: |
          set -e
          args=()
          [ -n "${{ secrets.AUTH_SECRET }}" ] && args+=("AUTH_SECRET=${{ secrets.AUTH_SECRET }}")
          [ -n "${{ secrets.JEREMYOS_CRON_SECRET }}" ] && args+=("CRON_SECRET=${{ secrets.JEREMYOS_CRON_SECRET }}")
          [ -n "${{ secrets.RESEND_API_KEY }}" ] && args+=("RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}")
          args+=("APP_URL=https://jeremyos-prod.fly.dev")
          args+=("EMAIL_FROM=JeremyOS <noreply@icanrebuild.com>")
          if [ "${#args[@]}" -lt 2 ]; then
            echo "Add at least JEREMYOS_CRON_SECRET (or AUTH_SECRET) in GitHub Actions secrets first"
            exit 1
          fi
          flyctl secrets set "${args[@]}" -a jeremyos-prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
