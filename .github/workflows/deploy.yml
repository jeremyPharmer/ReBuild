name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy jeremyos-prod
        run: flyctl deploy -c fly.prod.toml -a jeremyos-prod --ha=false --vm-memory 512
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
