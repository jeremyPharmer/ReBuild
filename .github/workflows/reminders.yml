name: Daily JeremyOS reminders

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "prod or preview"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - preview

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder cron on Vercel
        env:
          JEREMYOS_CRON_SECRET: ${{ secrets.JEREMYOS_CRON_SECRET }}
          REBUILD_CRON_SECRET: ${{ secrets.REBUILD_CRON_SECRET }}
          APP_URL: ${{ secrets.JEREMYOS_APP_URL }}
          TARGET: ${{ github.event.inputs.target || 'prod' }}
        run: |
          set -euo pipefail
          CRON_SECRET="${JEREMYOS_CRON_SECRET:-${REBUILD_CRON_SECRET:-}}"
          if [ -z "${CRON_SECRET}" ]; then
            echo "JEREMYOS_CRON_SECRET (or legacy REBUILD_CRON_SECRET) is not set"
            exit 1
          fi
          if [ -z "${APP_URL:-}" ]; then
            echo "Set GitHub secret JEREMYOS_APP_URL to your Vercel production URL"
            exit 1
          fi
          URL="${APP_URL%/}/api/cron/reminders"
          curl -fsS -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
