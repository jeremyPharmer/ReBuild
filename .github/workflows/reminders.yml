name: Daily JeremyOS reminders

on:
  schedule:
    # Every 15 minutes — app decides due morning/evening (with same-day catch-up)
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "dev or prod"
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder cron
        env:
          JEREMYOS_CRON_SECRET: ${{ secrets.JEREMYOS_CRON_SECRET }}
          REBUILD_CRON_SECRET: ${{ secrets.REBUILD_CRON_SECRET }}
          TARGET: ${{ github.event.inputs.target || 'prod' }}
        run: |
          set -euo pipefail
          CRON_SECRET="${JEREMYOS_CRON_SECRET:-${REBUILD_CRON_SECRET:-}}"
          if [ -z "${CRON_SECRET}" ]; then
            echo "JEREMYOS_CRON_SECRET (or legacy REBUILD_CRON_SECRET) is not set in GitHub Actions secrets"
            exit 1
          fi
          if [ "$TARGET" = "dev" ]; then
            URL="https://jeremyos-dev.fly.dev/api/cron/reminders"
          else
            URL="https://jeremyos-prod.fly.dev/api/cron/reminders"
          fi
          curl -fsS -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
