# RETIRED — jeremyos-dev was deleted (2026-08-31). Do not `fly deploy` this file.
# Local experiments: `npm run dev`. Ship: `fly.prod.toml` → jeremyos-prod.
# See DEPLOY.md.

# fly.toml app configuration file generated for jeremyos-dev
# See https://fly.io/docs/reference/configuration/

app = 'jeremyos-dev'
primary_region = 'sjc'

[build]

[env]
  NODE_ENV = 'production'
  JEREMYOS_ENV = 'dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'jeremyos_dev_data'
  destination = '/app/.data'
